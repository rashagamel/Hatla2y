<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hatla2y هتلاقي — Sales Copilot</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="theme-color" content="#1A3B49">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root{
    /* hatla2y: forest night, sage, tan and saffron gold */
    --bg:#1A3B49; --surface:rgba(32,70,84,0.86); --surface-2:rgba(42,86,104,0.90); --surface-3:#356679;
    --border:#4D8296; --border-focus:#CAFFA6; --text:#F7F9E1; --text-dim:#C9E8F3; --text-faint:#93C0CF;
    --gold:#CAFFA6; --gold-dim:#A9E0F1; --green:#8FCB9B; --amber:#E8A25A; --red:#F0836B;
    --green-bg:rgba(143,203,155,0.12); --green-border:rgba(143,203,155,0.38);
    --amber-bg:rgba(227,163,94,0.12); --amber-border:rgba(227,163,94,0.38);
    --red-bg:rgba(240,131,107,0.12); --red-border:rgba(240,131,107,0.38);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter','Readex Pro',sans-serif; font-size:17.9px;
        display:flex; height:100vh; overflow:hidden; }
  .mono{ font-family:'Readex Pro','Inter',sans-serif; }
  button{ font-family:inherit; cursor:pointer; }

  /* Sidebar */
  #sidebar{ width:300px; min-width:300px; background:var(--surface); border-right:1px solid var(--border);
             display:flex; flex-direction:column; }
  #sidebar-header{ padding:20px 20px 14px; border-bottom:1px solid var(--border); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand-mark{ flex-shrink:0; }
  .brand-name{ font-family:'Readex Pro','Inter',sans-serif; font-weight:600; font-size:28.1px; letter-spacing:-0.01em; color:var(--text); }
  .brand-tagline{ font-size:14.0px; letter-spacing:0.02em; color:var(--text-dim); margin-left:40px; }

  /* User Auth Session Bar in Sidebar */
  .user-session-bar{ margin-top:12px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--border);
       border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-size:14.7px; }
  .user-badge{ display:flex; align-items:center; gap:6px; overflow:hidden; }
  .user-name{ font-weight:600; color:var(--text); white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
  .user-role{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase;
       padding:2px 5px; border-radius:4px; background:rgba(202,255,166,0.18); color:var(--gold); }
  .auth-action-btn{ background:none; border:none; color:var(--text-dim); font-size:14.0px; cursor:pointer; text-decoration:underline; }
  .auth-action-btn:hover{ color:var(--text); }

  /* Navigation Tabs */
  #nav-tabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:10px 10px 0; }
  .nav-tab{ background:none; border:1px solid var(--border); color:var(--text-dim); font-size:14.0px;
            padding:7px 4px; border-radius:6px; text-transform:uppercase; letter-spacing:0.03em; text-align:center; }
  .nav-tab.active{ background:var(--surface-2); color:var(--gold); border-color:var(--gold-dim); font-weight:600; }
  .nav-tab:hover:not(.active){ color:var(--text); background:rgba(255,255,255,0.02); }

  #lead-list{ overflow-y:auto; flex:1; padding:10px 8px; }
  .lead-item{ padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:3px; border:1px solid transparent; }
  .lead-item:hover{ background:var(--surface-2); }
  .lead-item.active{ background:var(--surface-2); border-color:var(--border); }
  .lead-item .name{ font-weight:600; font-size:17.2px; }
  .lead-item .meta{ color:var(--text-dim); font-size:14.0px; margin-top:3px; }
  .intent-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; }
  .intent-high{ background:var(--green); } .intent-medium{ background:var(--amber); }
  .intent-low, .intent-unknown{ background:var(--text-faint); }

  /* Data mode badge */
  #data-mode-badge{ padding:8px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px;
       font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; }
  .dm-stat{ display:flex; flex-direction:column; }
  .dm-stat .n{ color:var(--text); font-weight:600; font-size:15.9px; }
  .dm-stat .l{ color:var(--text-faint); font-size:12.9px; text-transform:uppercase; letter-spacing:0.04em; }
  .dm-stat.real .n{ color:var(--green); }
  .dm-stat.demo .n{ color:var(--text-dim); }

  /* Add lead button + form */
  #add-lead-btn{ margin:8px 10px 4px; padding:8px; background:var(--surface-2); border:1px dashed var(--gold-dim);
       border-radius:8px; color:var(--gold); font-size:15.3px; text-align:center; font-weight:500; }
  #add-lead-btn:hover{ background:var(--surface-3); }

  /* Modal Base */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex;
       align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px); }
  .modal-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px;
       padding:24px 28px; width:460px; max-height:85vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.6); }
  .modal-card h3{ font-family:'Readex Pro','Inter',sans-serif; font-size:24.3px; margin:0 0 16px; color:var(--text); }
  .modal-card label{ display:block; font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px;
       text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin:12px 0 5px; }
  .modal-card input, .modal-card select, .modal-card textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border);
       border-radius:6px; color:var(--text); padding:8px 10px; font-family:inherit; font-size:16.6px; }
  .modal-card textarea{ resize:vertical; min-height:60px; }
  .modal-card .form-row{ display:flex; gap:10px; }
  .modal-card .form-row > div{ flex:1; }
  .modal-card .form-actions{ display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }
  .btn-cancel{ background:none; border:1px solid var(--border); color:var(--text-dim);
       padding:8px 15px; border-radius:6px; font-size:15.3px; }
  .btn-save{ background:var(--gold-dim); border:none; color:var(--bg); font-weight:600;
       padding:8px 16px; border-radius:6px; font-size:15.3px; }
  .btn-save:hover{ background:var(--gold); }

  /* Main View */
  #main{ flex:1; overflow-y:auto; padding:28px 36px; }
  #empty-state{ color:var(--text-dim); padding-top:120px; text-align:center; font-size:19.2px; }

  .profile-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
  .profile-header h2{ font-family:'Readex Pro','Inter',sans-serif; font-size:33.2px; font-weight:600; margin:0 0 4px; }
  .profile-header .sub{ color:var(--text-dim); font-size:16.6px; display:flex; align-items:center; gap:8px; }
  .lead-source-tag{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; padding:2px 7px; border-radius:4px; }
  .lead-source-tag.real{ background:rgba(143,203,155,0.18); color:var(--green); }
  .lead-source-tag.synthetic{ background:rgba(169,224,241,0.15); color:var(--text-dim); }
  .assigned-agent-pill{ font-family:'Readex Pro','Inter',sans-serif; font-size:13.4px; background:var(--surface-2);
       border:1px solid var(--border); padding:3px 8px; border-radius:4px; color:var(--text-dim); }
  .assigned-agent-pill select{ background:none; border:none; color:var(--gold); font-family:inherit; font-weight:500; cursor:pointer; }
  .header-actions{ display:flex; gap:6px; align-items:center; }
  .icon-btn{ background:none; border:1px solid var(--border); color:var(--text-dim); font-size:14.7px;
       padding:6px 11px; border-radius:6px; }
  .icon-btn:hover{ color:var(--text); border-color:var(--gold-dim); }
  .icon-btn.danger:hover{ color:var(--red); border-color:var(--red); }

  /* Canonical 8-Stage Stepper */
  .status-stepper-wrap{ margin-bottom:20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .stepper-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stepper-title{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); }
  .btn-history{ background:none; border:none; font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; color:var(--gold); cursor:pointer; text-decoration:underline; }
  .status-stepper{ display:flex; gap:5px; flex-wrap:wrap; }
  .status-step{ font-family:'Readex Pro','Inter',sans-serif; font-size:13.4px; padding:5px 9px; border-radius:5px;
       border:1px solid var(--border); color:var(--text-faint); background:none; }
  .status-step.active{ background:var(--gold-dim); border-color:var(--gold-dim); color:var(--bg); font-weight:600; }
  .status-step.is-lost.active{ background:var(--red); border-color:var(--red); }
  .status-step.is-won.active{ background:var(--green); border-color:var(--green); }
  .status-step:hover:not(.active){ color:var(--text); border-color:var(--gold-dim); }

  /* Structured AI Lead Intelligence Card (Phase 5) */
  .intelligence-card{ background:linear-gradient(145deg, var(--surface-2), var(--surface)); border:1px solid var(--gold-dim);
       border-radius:12px; padding:20px 22px; margin-bottom:22px; box-shadow:0 4px 20px rgba(0,0,0,0.3); }
  .intel-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .intel-title{ font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; text-transform:uppercase; letter-spacing:0.1em;
       color:var(--gold); display:flex; align-items:center; gap:8px; }
  .intel-priority-pill{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase;
       padding:4px 9px; border-radius:5px; font-weight:600; letter-spacing:0.06em; }
  .priority-high{ background:var(--red-bg); color:var(--red); border:1px solid var(--red-border); }
  .priority-medium{ background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-border); }
  .priority-low{ background:rgba(169,224,241,0.15); color:var(--text-dim); border:1px solid var(--border); }
  .intel-explanation{ font-size:17.2px; line-height:1.5; color:var(--text); margin-bottom:16px; }

  .dimension-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
  .dimension-box{ background:var(--surface-3); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .dimension-header{ display:flex; align-items:center; gap:6px; font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px; }
  .dimension-val{ font-weight:600; font-size:15.9px; }
  .dimension-val.fit-yes{ color:var(--green); }
  .dimension-val.fit-no{ color:var(--red); }
  .dimension-val.fit-neutral{ color:var(--gold); }
  .dimension-reason{ font-size:14.0px; color:var(--text-dim); margin-top:4px; line-height:1.3; }

  .factors-section{ display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--border); padding-top:12px; }
  .factors-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .factors-label{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; color:var(--text-faint); width:80px; flex-shrink:0; }
  .tag-chip{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; padding:3px 8px; border-radius:12px; }
  .tag-chip.positive{ background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); }
  .tag-chip.warning{ background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-border); }
  .tag-chip.missing{ background:var(--red-bg); color:var(--red); border:1px solid var(--red-border); }

  /* Next Action Card */
  .action-card{ background:linear-gradient(135deg, var(--surface-3), var(--surface-2)); border:1px solid var(--border);
       border-radius:12px; padding:18px 20px; margin-bottom:22px; }
  .action-eyebrow{ font-family:'Readex Pro','Inter',sans-serif; font-size:13.4px; letter-spacing:0.1em;
       color:var(--gold); text-transform:uppercase; margin-bottom:8px; display:flex; justify-content:space-between; }
  .action-headline{ font-family:'Readex Pro','Inter',sans-serif; font-size:23.0px; font-weight:600; margin-bottom:6px; }
  .action-why{ color:var(--text-dim); font-size:15.9px; margin-bottom:12px; }
  .action-msg{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:11px 13px;
       font-size:16.6px; line-height:1.45; }
  .track-row{ display:flex; gap:8px; margin-top:14px; }
  .track-btn{ background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--gold); font-size:14.0px;
       padding:6px 12px; border-radius:6px; }
  .track-btn:hover{ background:var(--surface-3); }

  /* Profile Grid */
  .profile-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border);
       border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:26px; }
  .profile-cell{ background:var(--surface); padding:12px 14px; }
  .profile-cell .label{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; letter-spacing:0.08em;
       color:var(--text-faint); margin-bottom:4px; }
  .profile-cell .value{ font-size:17.2px; font-weight:500; }

  /* Section Title */
  .section-title{ font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; text-transform:uppercase; letter-spacing:0.1em;
       color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .section-title::after{ content:''; flex:1; height:1px; background:var(--border); }

  /* Match Cards with AVM Valuation Tags */
  .match-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .match-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .match-title{ font-weight:600; font-size:19.2px; }
  .match-loc{ color:var(--text-dim); font-size:15.3px; margin-top:2px; }
  .match-price{ font-family:'Readex Pro','Inter',sans-serif; font-size:15.3px; color:var(--text-dim); margin-top:5px; }
  .score-badge{ font-family:'Readex Pro','Inter',sans-serif; font-size:23.0px; font-weight:600; min-width:55px; text-align:right; }
  .score-high{ color:var(--green); } .score-mid{ color:var(--amber); } .score-low{ color:var(--red); }
  .fingerprint{ height:4px; margin:12px 0 10px; border-radius:3px; overflow:hidden; background:var(--border); }
  .fp-fill{ height:100%; }
  .reasons{ display:flex; flex-direction:column; gap:4px; font-size:15.3px; }
  .reason-row{ display:flex; gap:7px; align-items:flex-start; }
  .reason-row .mark{ width:12px; flex-shrink:0; font-family:'Readex Pro','Inter',sans-serif; }
  .reason-row.good .mark{ color:var(--green); } .reason-row.warn .mark{ color:var(--amber); }
  .reason-row.good{ color:var(--text-dim); } .reason-row.warn{ color:var(--text); }

  /* Valuation Pill on Match Card */
  .match-valuation-badge{ display:inline-flex; align-items:center; gap:6px; font-family:'Readex Pro','Inter',sans-serif;
       font-size:13.4px; padding:3px 8px; border-radius:5px; margin-top:8px; }
  .val-undervalued{ background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); }
  .val-fair_value{ background:rgba(143,203,155,0.1); color:var(--gold); border:1px solid var(--gold-dim); }
  .val-overpriced{ background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-border); }

  .match-card-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .view-plans-btn, .view-val-btn{ background:none; border:1px solid var(--border); color:var(--text-dim); font-size:14.0px;
       padding:4px 9px; border-radius:5px; }
  .view-plans-btn:hover, .view-val-btn:hover{ color:var(--text); border-color:var(--gold-dim); }

  .plans-panel, .val-panel{ margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
  .plan-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; margin-bottom:5px; font-size:15.3px; }
  .plan-row.GREEN{ background:var(--green-bg); border:1px solid var(--green-border); }
  .plan-row.YELLOW{ background:var(--amber-bg); border:1px solid var(--amber-border); }
  .plan-row.RED{ background:var(--red-bg); border:1px solid var(--red-border); }
  .plan-row.UNKNOWN{ background:var(--surface-2); border:1px solid var(--border); }
  .plan-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .plan-dot.GREEN{ background:var(--green); } .plan-dot.YELLOW{ background:var(--amber); }
  .plan-dot.RED{ background:var(--red); } .plan-dot.UNKNOWN{ background:var(--text-faint); }
  .plan-terms{ font-family:'Readex Pro','Inter',sans-serif; width:140px; flex-shrink:0; font-size:14.7px; }
  .plan-reason{ font-size:14.7px; color:var(--text-dim); }
  .plan-recommendation{ font-size:14.7px; color:var(--gold); margin-top:6px; font-style:italic; }

  /* Analytics Dashboard (Phase 9) */
  .analytics-kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
  .kpi-label{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:8px; }
  .kpi-val{ font-family:'Readex Pro','Inter',sans-serif; font-size:30.7px; font-weight:600; color:var(--gold); }
  .kpi-sub{ font-size:14.0px; color:var(--text-dim); margin-top:4px; }

  /* Funnel Visualization */
  .funnel-container{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:26px; }
  .funnel-stage-row{ display:flex; align-items:center; gap:14px; margin-bottom:8px; font-size:15.9px; }
  .funnel-stage-label{ width:120px; font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; color:var(--text-dim); }
  .funnel-track{ flex:1; height:24px; background:var(--surface-2); border-radius:4px; overflow:hidden; position:relative; }
  .funnel-fill{ height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius:4px; display:flex; align-items:center; padding-left:10px; font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; font-weight:600; color:var(--bg); min-width:30px; }
  .funnel-rate{ font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; width:70px; text-align:right; color:var(--text-dim); }

  /* Leaderboard Table */
  .data-table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:26px; }
  .data-table th{ background:var(--surface-2); font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); }
  .data-table td{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:15.9px; }
  .data-table tr:last-child td{ border-bottom:none; }
  .data-table tr:hover td{ background:var(--surface-2); }

  /* Valuation Tab (Phase 7 AVM) */
  .val-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .val-form-card, .val-result-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:22px; }
  .val-input-group{ margin-bottom:14px; }
  .val-input-group label{ display:block; font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; color:var(--text-faint); margin-bottom:5px; }
  .val-input-group input, .val-input-group select{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 10px; font-size:16.6px; }
  .checkbox-group{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px; }
  .checkbox-label{ display:flex; align-items:center; gap:6px; font-size:15.3px; color:var(--text-dim); cursor:pointer; }
  .btn-predict{ background:var(--gold-dim); border:none; color:var(--bg); font-weight:600; width:100%; padding:10px; border-radius:6px; font-size:16.6px; margin-top:14px; cursor:pointer; }
  .btn-predict:hover{ background:var(--gold); }

  .val-estimate-hero{ padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:14px; text-align:center; }
  .val-hero-num{ font-family:'Readex Pro','Inter',sans-serif; font-size:40.9px; font-weight:600; color:var(--gold); }
  .val-hero-sub{ font-size:15.3px; color:var(--text-dim); margin-top:4px; font-family:'Readex Pro','Inter',sans-serif; }

  /* Chat Sim */
  #chat-panel{ display:flex; flex-direction:column; height:100%; max-width:680px; }
  #chat-log{ flex:1; overflow-y:auto; padding-bottom:16px; }

  .chat-bubble.extraction{ background:none; border:1px dashed var(--gold-dim); color:var(--gold); font-family:'Readex Pro','Inter',sans-serif; font-size:14.0px; margin:0 auto 12px; max-width:95%; padding:9px 12px; border-radius:8px; }
  .chat-bubble.reply{ background:rgba(143,203,155,0.10); border:1px solid rgba(143,203,155,0.35); margin-left:auto; margin-right:0; border-bottom-right-radius:3px; }
  .chat-bubble.reply .reply-label{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; text-transform:uppercase; letter-spacing:0.05em; color:var(--green); margin-bottom:4px; }

  /* Pipeline Tab */
  .priority-queue-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
  .priority-queue-row{ display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:11px 15px; cursor:pointer; }
  .priority-queue-row:hover{ border-color:var(--gold-dim); }
  .pq-score{ font-family:'Readex Pro','Inter',sans-serif; font-size:20.4px; font-weight:600; color:var(--gold); width:44px; }
  .pq-name{ font-weight:600; flex:1; }
  .pq-action{ font-family:'Readex Pro','Inter',sans-serif; font-size:13.4px; color:var(--text-dim); text-transform:uppercase; }

  .maturity-card{ border-radius:12px; padding:18px 20px; margin-bottom:26px; border:1px solid; }
  .maturity-card.level-verylow{ background:rgba(240,131,107,0.08); border-color:rgba(240,131,107,0.4); }
  .maturity-card.level-low{ background:rgba(227,163,94,0.08); border-color:rgba(227,163,94,0.4); }
  .maturity-card.level-moderate{ background:rgba(227,163,94,0.08); border-color:var(--gold-dim); }
  .maturity-card.level-good{ background:rgba(143,203,155,0.08); border-color:rgba(143,203,155,0.4); }
  .maturity-card.level-higher{ background:rgba(143,203,155,0.12); border-color:var(--green); }
  .maturity-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .maturity-title{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; letter-spacing:0.1em; color:var(--text-faint); text-transform:uppercase; }
  .maturity-label{ font-family:'Readex Pro','Inter',sans-serif; font-size:24.3px; font-weight:600; margin:3px 0 2px; }
  .maturity-count{ font-family:'Readex Pro','Inter',sans-serif; font-size:14.7px; color:var(--text-dim); }
  .maturity-reliability-pill{ font-family:'Readex Pro','Inter',sans-serif; font-size:12.9px; padding:3px 8px; border-radius:5px; text-transform:uppercase; background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .maturity-warning{ font-size:15.3px; color:var(--text-dim); margin-top:8px; line-height:1.45; }
  .maturity-footnote{ font-size:12.9px; color:var(--text-faint); margin-top:6px; font-style:italic; }

  .retrain-btn{ background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--gold); font-size:14.7px; padding:8px 14px; border-radius:7px; margin-top:16px; }
  .retrain-btn:hover{ background:var(--surface-3); }

  #loading{ color:var(--text-faint); padding:40px 0; text-align:center; font-family:'Readex Pro','Inter',sans-serif; font-size:15.3px; }

  /* ===== hatla2y theme layer ===== */
  body{ background:
          radial-gradient(900px 520px at 88% -8%, rgba(169,224,241,.30), transparent 62%),
          radial-gradient(800px 520px at -6% 108%, rgba(169,224,241,.22), transparent 60%),
          var(--bg); }
  /* skyline wallpaper: drawn lines of towers, blocks, villas and a minaret, faded into the page */
  body::before{ content:""; position:fixed; left:0; right:0; bottom:0; height:74vh; z-index:0; pointer-events:none;
       background:url('/static/skyline.svg') center bottom / cover no-repeat; opacity:.22;
       -webkit-mask-image:linear-gradient(to top,#000 30%,transparent 100%);
               mask-image:linear-gradient(to top,#000 30%,transparent 100%); }
  #sidebar,#main{ position:relative; z-index:1; }
  #sidebar{ -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .brand-name{ display:flex; align-items:baseline; direction:ltr; font-family:'Readex Pro','Inter',sans-serif;
       font-weight:700; font-size:26.8px; letter-spacing:-0.02em; }
  .brand-latin{ color:var(--text); }
  .brand-sep{ color:#A9E0F1; margin:0 1px; }
  .brand-ar{ color:var(--gold); font-weight:600; direction:rtl; unicode-bidi:isolate; letter-spacing:0; }
  .brand{ gap:12px; }
  .nav-tab.active{ box-shadow:0 0 0 1px rgba(202,255,166,.25), 0 6px 18px -8px rgba(202,255,166,.45); }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div class="brand">
      <svg class="brand-mark" width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#204654" stroke="#4D8296" stroke-width="2"/>
        <path d="M32 12 51 28v24H38V38H26v14H13V28Z" stroke="#CAFFA6" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="32" cy="29" r="3.5" fill="#8FCB9B"/>
      </svg>
      <div class="brand-name" aria-label="Hatla2y هتلاقي"><span class="brand-latin">Hatla2y</span><span class="brand-sep">&nbsp;</span><span class="brand-ar" lang="ar">هتلاقي</span></div>
    </div>
    <div class="brand-tagline">Real estate sales copilot</div>
    <div id="auth-session-container"></div>
  </div>

  <div id="nav-tabs">
    <button class="nav-tab active" data-tab="matches" onclick="setTab('matches')">Matches</button>
    <button class="nav-tab" data-tab="chat" onclick="setTab('chat')">Chat sim</button>
    <button class="nav-tab" data-tab="pipeline" onclick="setTab('pipeline')">Pipeline</button>
    <button class="nav-tab" data-tab="analytics" onclick="setTab('analytics')">Analytics</button>
    <button class="nav-tab" data-tab="valuation" onclick="setTab('valuation')">Valuation</button>
  </div>

  <div id="data-mode-badge"></div>
  <button id="add-lead-btn" onclick="openLeadForm()">+ Add New Lead</button>
  <div id="lead-list"></div>
</div>

<div id="main">
  <div id="empty-state">Select a lead to get started.</div>
</div>

<script>
const API = '/api';
let leads = [];
let salesAgents = [];
let currentLeadId = null;
let currentTab = 'matches';
let renderToken = 0;

// Submarket location presets
const LOCATIONS = ["New Cairo","6th of October","Sheikh Zayed","North Coast","Red Sea","Mostakbal City",
                   "Ain Sokhna","Madinaty","New Capital","Heliopolis","El Shorouk","Maadi","Nasr City","Zamalek"];

// Canonical 8 Pipeline Stages
const CANONICAL_STAGES = [
  {id: 'new', label: 'New'},
  {id: 'contacted', label: 'Contacted'},
  {id: 'qualified', label: 'Qualified'},
  {id: 'interested', label: 'Interested'},
  {id: 'site_visit', label: 'Site Visit'},
  {id: 'negotiation', label: 'Negotiation'},
  {id: 'won', label: 'Won'},
  {id: 'lost', label: 'Lost'}
];

/* Helper for authenticated fetch with JWT */
async function authFetch(url, options = {}){
  const token = localStorage.getItem('tasahel_token');
  const headers = Object.assign({}, options.headers || {});
  if(token && !headers['Authorization']){
    headers['Authorization'] = `Bearer ${token}`;
  }
  const res = await fetch(url, Object.assign({}, options, { headers }));
  if(res.status === 401){
    // session expired or login required: clear it and go to the login screen
    try { localStorage.removeItem('tasahel_token'); localStorage.removeItem('tasahel_user'); } catch(e){}
    window.location.href = '/login';
    return new Promise(() => {});          // stop callers from rendering with an error body
  }
  return res;
}

function managerOnlyNotice(what){
  return `<div id="empty-state">${what} is available to managers only. Ask your manager for access.</div>`;
}

/* User Session Header */
function renderAuthHeader(){
  const container = document.getElementById('auth-session-container');
  const userJson = localStorage.getItem('tasahel_user');
  if(userJson){
    try {
      const u = JSON.parse(userJson);
      container.innerHTML = `
        <div class="user-session-bar">
          <div class="user-badge">
            <span class="user-name">👤 ${u.name || u.email}</span>
            <span class="user-role">${u.role}</span>
          </div>
          <button class="auth-action-btn" onclick="logoutUser()">Sign out</button>
        </div>
      `;
      return;
    } catch(e){}
  }
  container.innerHTML = `
    <div class="user-session-bar">
      <span style="color:var(--text-faint)">Session: Guest / Demo</span>
      <a href="/login" class="auth-action-btn" style="color:var(--gold)">Sign in</a>
    </div>
  `;
}

function logoutUser(){
  localStorage.removeItem('tasahel_token');
  localStorage.removeItem('tasahel_user');
  renderAuthHeader();
  loadLeads();
}

/* Load Leads & Agents */
async function loadLeads(){
  renderAuthHeader();
  try {
    const [leadRes, agentRes] = await Promise.all([
      authFetch(`${API}/leads`),
      authFetch(`${API}/agents`)
    ]);
    leads = await leadRes.json();
    if(agentRes.ok){
      salesAgents = await agentRes.json();
    }
  } catch(e){
    console.error('Failed loading leads:', e);
  }
  renderLeadList();
  renderDataModeBadge();
  if(leads.length && !currentLeadId){
    selectLead(leads[0].id);
  }
}

async function renderDataModeBadge(){
  try {
    const res = await authFetch(`${API}/stats`);
    const s = await res.json();
    const badge = document.getElementById('data-mode-badge');
    badge.innerHTML = `
      <div class="dm-stat demo"><div class="n">${s.demo_leads}</div><div class="l">Demo Leads</div></div>
      <div class="dm-stat real"><div class="n">${s.real_leads}</div><div class="l">Real Leads</div></div>
      <div class="dm-stat real"><div class="n">${s.real_properties.toLocaleString()}</div><div class="l">Real Props</div></div>
    `;
  } catch(e){}
}

function renderLeadList(){
  const list = document.getElementById('lead-list');
  const showList = currentTab === 'matches' || currentTab === 'chat';
  list.style.display = showList ? 'block' : 'none';
  list.innerHTML = leads.map(l => `
    <div class="lead-item ${l.id === currentLeadId ? 'active' : ''}" data-id="${l.id}" onclick="selectLead(${l.id})">
      <div class="name"><span class="intent-dot intent-${l.intent}"></span>${l.name}</div>
      <div class="meta">${l.preferred_locations || '—'} · ${fmtMoney(l.budget_max)} ${l.data_source === 'real' ? '· <span style="color:var(--green)">real</span>' : ''}</div>
    </div>
  `).join('');
}

function fmtMoney(n){
  if(n === null || n === undefined) return '—';
  return (n/1_000_000).toFixed(1) + 'M EGP';
}

function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  renderLeadList();
  if(tab === 'pipeline') renderPipeline();
  else if(tab === 'analytics') renderAnalytics();
  else if(tab === 'valuation') renderValuationTab();
  else if(currentLeadId) selectLead(currentLeadId);
}

/* Select Lead & Orchestrate Matches View */
async function selectLead(id){
  currentLeadId = id;
  renderLeadList();
  const myToken = ++renderToken;
  if(currentTab === 'pipeline'){ renderPipeline(); return; }
  if(currentTab === 'analytics'){ renderAnalytics(); return; }
  if(currentTab === 'valuation'){ renderValuationTab(); return; }

  const main = document.getElementById('main');
  main.innerHTML = '<div id="loading">Synthesizing intelligence + installment matching + valuation…</div>';

  try {
    const [leadRes, matchRes, scoreRes, actionRes, statsRes, intelRes] = await Promise.all([
      authFetch(`${API}/leads/${id}`),
      authFetch(`${API}/leads/${id}/matches?top_n=5`),
      authFetch(`${API}/leads/${id}/score`, {method:'POST'}),
      authFetch(`${API}/leads/${id}/next-action`, {method:'POST'}),
      authFetch(`${API}/stats`),
      authFetch(`${API}/leads/${id}/intelligence`),
    ]);

    const { lead } = await leadRes.json();
    const matches = await matchRes.json();
    const scoreData = await scoreRes.json();
    const actionData = await actionRes.json();
    const statsData = await statsRes.json();
    const intelData = intelRes.ok ? await intelRes.json() : null;

    if(myToken !== renderToken) return;
    if(currentTab === 'chat') renderChat(lead);
    else renderMatchesView(lead, matches, scoreData, actionData, statsData, intelData);
  } catch(err){
    console.error('Error fetching lead data:', err);
    main.innerHTML = '<div id="empty-state">Unable to load lead details. Please try again.</div>';
  }
}

function scoreClass(score){ if(score >= 80) return 'score-high'; if(score >= 55) return 'score-mid'; return 'score-low'; }
function barColor(score){ if(score >= 80) return 'var(--green)'; if(score >= 55) return 'var(--amber)'; return 'var(--red)'; }

/* Render Phase 5 Structured AI Lead Intelligence */
function renderIntelligenceCard(intel){
  if(!intel) return '';
  const pClass = `priority-${intel.priority || 'medium'}`;

  // three states: fit / gap (does not fit) / unknown (not stated yet). Falls back to the old booleans.
  const fitBadge = (status, flag, labels) => {
    const s = status || (flag ? 'fit' : 'gap');
    const cls = s === 'fit' ? 'fit-yes' : (s === 'gap' ? 'fit-no' : 'fit-neutral');
    return `<div class="dimension-val ${cls}">${labels[s]}</div>`;
  };
  const budgetFitHtml = fitBadge(intel.budget_status, intel.budget_fit,
    {fit:'✓ Fits Budget', gap:'✗ Nothing In Budget', unknown:'? Budget Not Stated'});
  const locationFitHtml = fitBadge(intel.location_status, intel.location_fit,
    {fit:'✓ Target Location', gap:'✗ Location Gap', unknown:'? Location Not Stated'});
  const financingFitHtml = fitBadge(intel.financing_status, intel.financing_fit,
    {fit:'✓ Affordable Plan', gap:'✗ No Plan Fits', unknown:'? Limits Not Stated'});

  const invHtml = `<div class="dimension-val fit-neutral">${intel.inventory_availability ? intel.inventory_availability.total_matches : 0} Matching Units</div>`;

  const posChips = (intel.positive_factors || []).map(f => `<span class="tag-chip positive">✓ ${f}</span>`).join('');
  const warnChips = (intel.warnings || []).map(w => `<span class="tag-chip warning">⚠ ${w}</span>`).join('');
  const missChips = (intel.missing_info || []).map(m => `<span class="tag-chip missing">? ${m}</span>`).join('');

  return `
    <div class="intelligence-card">
      <div class="intel-top">
        <div class="intel-title">
          <span>🧠 AI Lead Intelligence</span>
          <span style="font-size:15.3px; color:var(--text-dim);">Quality Score: <b class="mono" style="color:var(--gold); font-size:17.9px;">${intel.score}/100</b>${intel.score_capped ? ` <span style="color:var(--amber); font-size:14.0px;">(capped from ${intel.raw_model_score}: nothing fits yet)</span>` : ''}</span>
        </div>
        <div class="intel-priority-pill ${pClass}">${intel.priority} Priority Tier</div>
      </div>
      <div class="intel-explanation">${intel.explanation}</div>

      <div class="dimension-grid">
        <div class="dimension-box">
          <div class="dimension-header">💰 Budget Fit</div>
          ${budgetFitHtml}
          <div class="dimension-reason">${intel.budget_fit_reason || '—'}</div>
        </div>
        <div class="dimension-box">
          <div class="dimension-header">📍 Location Fit</div>
          ${locationFitHtml}
          <div class="dimension-reason">${intel.location_fit_reason || '—'}</div>
        </div>
        <div class="dimension-box">
          <div class="dimension-header">📑 Financing Fit</div>
          ${financingFitHtml}
          <div class="dimension-reason">${intel.financing_fit_reason || '—'}</div>
        </div>
        <div class="dimension-box">
          <div class="dimension-header">🏢 Inventory Fit</div>
          ${invHtml}
          <div class="dimension-reason">Available in target districts</div>
        </div>
      </div>

      <div class="factors-section">
        ${posChips ? `<div class="factors-row"><span class="factors-label">Strengths:</span>${posChips}</div>` : ''}
        ${warnChips ? `<div class="factors-row"><span class="factors-label">Warnings:</span>${warnChips}</div>` : ''}
        ${missChips ? `<div class="factors-row"><span class="factors-label">Gaps:</span>${missChips}</div>` : ''}
      </div>
    </div>
  `;
}

/* Render Main Matches View */
function renderMatchesView(lead, matches, scoreData, actionData, statsData, intelData){
  const main = document.getElementById('main');
  const assignedAgent = salesAgents.find(a => a.id === lead.assigned_agent_id);

  // Normalize current status
  const currentStatusNorm = (lead.status === 'viewing_booked' ? 'site_visit' : (lead.status === 'negotiating' ? 'negotiation' : lead.status));

  main.innerHTML = `
    <div class="profile-header">
      <div>
        <h2>${lead.name}
          <span class="lead-source-tag ${lead.data_source}">${lead.data_source}</span>
          ${lead.lost_reason ? `<span class="tag-chip missing" style="margin-left:6px;">Lost: ${lead.lost_reason}</span>` : ''}
        </h2>
        <div class="sub">
          <span>${lead.channel} · lead #${lead.id}</span>
          <span class="assigned-agent-pill">
            👤 Agent:
            <select onchange="reassignLead(${lead.id}, this.value)">
              <option value="">Unassigned</option>
              ${salesAgents.map(a => `<option value="${a.id}" ${lead.assigned_agent_id === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
            </select>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick='openLeadForm(${JSON.stringify(lead)})'>Edit</button>
        <button class="icon-btn danger" onclick="deleteLead(${lead.id})">Delete</button>
      </div>
    </div>

    <!-- Canonical 8-Stage Pipeline Stepper -->
    <div class="status-stepper-wrap">
      <div class="stepper-header">
        <div class="stepper-title">Sales Pipeline Stage Machine</div>
        <button class="btn-history" onclick="viewPipelineHistory(${lead.id})">📜 Transition History</button>
      </div>
      <div class="status-stepper">
        ${CANONICAL_STAGES.map(s => `
          <button class="status-step ${s.id === currentStatusNorm ? 'active' : ''} ${s.id === 'lost' ? 'is-lost' : ''} ${s.id === 'won' ? 'is-won' : ''}"
                  onclick="handleStageClick(${lead.id}, '${s.id}', '${currentStatusNorm}')">
            ${s.label}
          </button>
        `).join('')}
      </div>
    </div>

    <!-- Structured AI Lead Intelligence (Phase 5) -->
    ${renderIntelligenceCard(intelData)}

    <!-- Smart Next Best Action (Phase 2) -->
    <div class="action-card">
      <div class="action-eyebrow">
        <span>Recommended Next Step</span>
        <span class="urgency-tag urgency-${actionData.urgency}">${actionData.urgency}</span>
      </div>
      <div class="action-headline">${actionLabel(actionData.action)}</div>
      <div class="action-why">${actionData.reasoning}</div>

      <div class="confidence-row">
        <div class="confidence-chip">Recommendation confidence: <b>${actionData.confidence}</b></div>
        <div class="confidence-chip">Scoring reliability: <b>${actionData.model_reliability}</b></div>
      </div>

      ${actionData.checklist && actionData.checklist.length ? `
        <div class="checklist-section">
          <div class="checklist-title">Why this recommendation</div>
          ${actionData.checklist.map(c => `<div class="checklist-item">✓ ${c}</div>`).join('')}
        </div>` : ''}

      ${actionData.talking_points && actionData.talking_points.length ? `
        <div class="talking-points">
          <div class="checklist-title">Talking points</div>
          ${actionData.talking_points.map(t => `<div class="talking-point">${t}</div>`).join('')}
        </div>` : ''}

      ${actionData.question_to_ask ? `<div class="question-box">💬 Ask: "${actionData.question_to_ask}"</div>` : ''}
      ${actionData.suggested_message ? `<div class="action-msg">"${actionData.suggested_message}"</div>` : ''}

      <div class="track-row">
        <button class="track-btn" onclick="trackNextAction(${lead.id}, 'selected')">✓ Mark selected</button>
        <button class="track-btn" onclick="trackNextAction(${lead.id}, 'completed')">✓ Mark done</button>
      </div>
    </div>

    <!-- Profile Details Grid -->
    <div class="section-title">Lead Requirements & Constraints</div>
    <div class="profile-grid">
      <div class="profile-cell"><div class="label">Budget Range</div><div class="value">${fmtMoney(lead.budget_min)} – ${fmtMoney(lead.budget_max)}</div></div>
      <div class="profile-cell"><div class="label">Payment Mode</div><div class="value">${lead.payment_preference}${lead.max_monthly_payment ? ' · ' + Math.round(lead.max_monthly_payment).toLocaleString() + ' EGP/mo max' : ''}</div></div>
      <div class="profile-cell"><div class="label">Locations</div><div class="value">${lead.preferred_locations || '—'}</div></div>
      <div class="profile-cell"><div class="label">Timeline</div><div class="value">${lead.purchase_timeline || 'unknown'}</div></div>
      <div class="profile-cell"><div class="label">Purpose</div><div class="value">${lead.purpose || '—'}</div></div>

async function handleStageClick(leadId, targetStage, currentStage){

  if(targetStage === 'lost'){
    openLostModal(leadId);
    return;
  }
  await executeTransition(leadId, targetStage);
}

async function executeTransition(leadId, status, payload = {}){
  try {
    const res = await authFetch(`${API}/leads/${leadId}/status`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({status}, payload))
    });
    const result = await res.json();
    if(!res.ok){
      alert(`Transition error: ${result.error || 'Invalid transition'}`);
      return;
    }
    const lRes = await authFetch(`${API}/leads`);
    leads = await lRes.json();
    renderLeadList();
    selectLead(leadId);
  } catch(err){
    alert('Connection error during status update.');
  }
}

      </div>

async function loadChatHistory(leadId){
  const res = await authFetch(`${API}/leads/${leadId}`);

  const log = document.getElementById('chat-log');
  log.innerHTML = events.slice().reverse()

    .map(e => `<div class="chat-bubble in">${e.payload}</div>`).join('');
  log.scrollTop = log.scrollHeight;
}

function sendChatSuggestion(i){
  document.getElementById('chat-input').value = SUGGESTIONS[i];
  sendChat();
}

async function sendChat(){
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if(!message) return;
  input.value = '';

  const log = document.getElementById('chat-log');
  const userBubble = document.createElement('div');
  userBubble.className = 'chat-bubble in';
  userBubble.textContent = message;
  log.appendChild(userBubble);

  const extractionBubble = document.createElement('div');
  extractionBubble.className = 'chat-bubble extraction';
  extractionBubble.textContent = 'Parsing message with Arabic/English extractor…';
  log.appendChild(extractionBubble);
  log.scrollTop = log.scrollHeight;

  try {
    const res = await authFetch(`${API}/leads/${currentLeadId}/chat`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message})
    });
    if(!res.ok){
      extractionBubble.textContent = '(Server returned error)';
      return;
    }
    const data = await res.json();
    const extractedObj = data.extracted || {};
    const fields = Object.entries(extractedObj).filter(([k, v]) => {
      if(v === null || v === undefined) return false;
      if(Array.isArray(v) && v.length === 0) return false;
      if(['objections', 'extraction_confidence', 'removed_locations', 'engagement_signal', 'field_confidence'].includes(k)) return false;
      return true;
    });

    extractionBubble.textContent = fields.length
      ? '✓ extracted: ' + fields.map(([k,v]) => `${k}=${Array.isArray(v) ? v.join(',') : typeof v === 'number' ? Math.round(v) : v}`).join(', ')
      : '(No new fields found in this message)';

    const removedLocs = (data.removed_preferences && data.removed_preferences.locations) || [];
    const signal = data.engagement_signal;
    if(removedLocs.length || signal){
      const chips = [
        ...removedLocs.map(l => `<span class="chat-signal-chip removed">✕ Ruled out: ${l}</span>`),
        signal ? `<span class="chat-signal-chip ${signal}">${signal.replace('_',' ')}</span>` : '',
      ].join('');
      log.insertAdjacentHTML('beforeend', `<div class="chat-signal-row">${chips}</div>`);
    }

    if(data.suggested_reply){
      log.insertAdjacentHTML('beforeend', `
        <div class="chat-bubble reply">
          <div class="reply-label">Grounded AI Suggested Reply</div>
          ${data.suggested_reply}
        </div>
      `);
    }
    log.scrollTop = log.scrollHeight;

    const leadRes = await authFetch(`${API}/leads`);
    leads = await leadRes.json();
    renderLeadList();
  } catch(err){
    extractionBubble.textContent = '(Extraction failed: connection error)';
  }
}

async function submitNewAgent(){
  const name = document.getElementById('new-agent-name').value.trim();
  const email = document.getElementById('new-agent-email').value.trim();
  const phone = document.getElementById('new-agent-phone').value.trim();
  if(!name){ alert('Agent name is required'); return; }

  try {
    const res = await authFetch(`${API}/agents`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, email, phone})

    if(res.ok){
      document.getElementById('agent-modal-overlay').remove();

      salesAgents = await aRes.json();

        <div><h2>Automated Valuation Model (AVM)</h2><div class="sub">Econometric price-prediction calibrated to 14 Egyptian submarkets</div></div>
      </div>

        <div class="kpi-card"><div class="kpi-label">MAPE Accuracy Error</div><div class="kpi-val">${metrics.mape_percent}%</div><div class="kpi-sub">Mean percentage error</div></div>
        <div class="kpi-card"><div class="kpi-label">Training Properties</div><div class="kpi-val">${metrics.sample_size}</div><div class="kpi-sub">${metrics.train_samples} train / ${metrics.test_samples} test</div></div>

            <div>

            </div>

            <label>Finishing Specification</label>

async function calculateValuation(){
  const resultCard = document.getElementById('val-result-card');
  resultCard.innerHTML = '<div style="color:var(--text-faint); padding:40px 0; text-align:center;">Estimating fair market valuation…</div>';

  const payload = {
    location: document.getElementById('val-location').value,
    property_type: document.getElementById('val-type').value,
    area_sqm: parseFloat(document.getElementById('val-area').value) || 150,
    bedrooms: parseInt(document.getElementById('val-beds').value) || 3,
    bathrooms: parseInt(document.getElementById('val-baths').value) || 2,
    finishing: document.getElementById('val-finishing').value,
    has_pool: document.getElementById('val-pool').checked ? 1 : 0,
    has_garden: document.getElementById('val-garden').checked ? 1 : 0,
    has_parking: document.getElementById('val-parking').checked ? 1 : 0,
    has_security: document.getElementById('val-security').checked ? 1 : 0,
  };

  try {
    const res = await authFetch(`${API}/valuation/predict`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    resultCard.innerHTML = `
      <div class="section-title">Valuation Results</div>
      <div class="val-estimate-hero">
        <div class="val-hero-num">${(data.estimated_price/1_000_000).toFixed(2)}M EGP</div>
        <div class="val-hero-sub">${Math.round(data.estimated_price).toLocaleString()} EGP Total · ${Math.round(data.estimated_price_per_sqm).toLocaleString()} EGP/sqm</div>
      </div>
      <div style="font-size:15.3px; color:var(--text-dim); margin-bottom:14px; text-align:center;">
        Estimated price range: <b class="mono" style="color:var(--text);">${(data.price_range_low/1_000_000).toFixed(2)}M</b> to <b class="mono" style="color:var(--text);">${(data.price_range_high/1_000_000).toFixed(2)}M EGP</b>
      </div>
      <div style="font-family:'Readex Pro','Inter',sans-serif; font-size:13.4px; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;">Model Price Driver Attribution</div>
      <div style="display:flex; flex-direction:column; gap:5px; font-size:15.3px; color:var(--text);">
        ${(data.price_drivers || []).map(d => `<div style="background:var(--surface-2); padding:6px 10px; border-radius:5px; border:1px solid var(--border);">✓ ${d}</div>`).join('')}
      </div>
      <div style="margin-top:14px; font-size:13.4px; color:var(--text-faint); font-style:italic;">
        Estimated from Egyptian property listings (Kaggle dataset). Asking prices, not closed-transaction prices.
      </div>
    `;
  } catch(e){
    resultCard.innerHTML = '<div style="color:var(--red);">Failed to compute valuation.</div>';
  }
}

async function saveLeadForm(editId){
  const selectedLocs = [...document.getElementById('lf-locations').selectedOptions].map(o => o.value);
  const name = document.getElementById('lf-name').value.trim();
  if(!name){ alert('Name is required'); return; }

  const payload = {
    name,
    phone: document.getElementById('lf-phone').value.trim(),
    budget_min: parseFloat(document.getElementById('lf-budget-min').value) || null,
    budget_max: parseFloat(document.getElementById('lf-budget-max').value) || null,
    payment_preference: document.getElementById('lf-payment').value,
    max_monthly_payment: parseFloat(document.getElementById('lf-monthly').value) || null,
    max_down_payment: parseFloat(document.getElementById('lf-down').value) || null,
    preferred_locations: selectedLocs.join(','),
    min_bedrooms: parseInt(document.getElementById('lf-bedrooms').value) || null,
    purpose: document.getElementById('lf-purpose').value,
    purchase_timeline: document.getElementById('lf-timeline').value,
  };

  if(editId){
    await authFetch(`${API}/leads/${editId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  } else {
    const res = await authFetch(`${API}/leads`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    const created = await res.json();
    editId = created.id;
  }
  document.getElementById('lead-form-overlay').remove();
  const leadRes = await authFetch(`${API}/leads`);
  leads = await leadRes.json();
  renderLeadList();
  renderDataModeBadge();
  selectLead(editId);
}

async function deleteLead(leadId){
  if(!confirm('Permanently delete this lead and related history?')) return;
  const delRes = await authFetch(`${API}/leads/${leadId}`, {method:'DELETE'});
  if(!delRes.ok){
    alert(delRes.status === 403 ? 'Only managers can delete leads.' : 'Could not delete the lead.');
    return;
  }
  const leadRes = await authFetch(`${API}/leads`);
  leads = await leadRes.json();
  renderLeadList();
  renderDataModeBadge();
  currentLeadId = null;
  if(leads.length) selectLead(leads[0].id);
  else document.getElementById('main').innerHTML = '<div id="empty-state">No leads available.</div>';
}
